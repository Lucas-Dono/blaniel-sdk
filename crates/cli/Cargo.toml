[package]
name = "blaniel-cli"
version.workspace = true
edition.workspace = true
description = "CLI tool for Blaniel NPC - quick setup for game developers"
license = "MIT"
repository = "https://github.com/blaniel/rust-npc-api"

[[bin]]
name = "blaniel-npc"
path = "src/main.rs"

[dependencies]
blaniel-sdk = { path = "../sdk" }
npc-types = { path = "../types" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
indicatif = "0.17"
